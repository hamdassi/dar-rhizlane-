plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darrhizlane.tablette'
    compileSdk 34

    defaultConfig {
        applicationId "com.darrhizlane.tablette"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signé avec la clé de debug pour rester installable sans configuration
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
